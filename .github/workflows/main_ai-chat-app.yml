# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - ai-chat-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: mvcwebapplication20240528.azurecr.io
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CA426B4397AE48E38D081ECA21509C3C }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_A0B772CA673C4762BEFF9527B43654B0 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./WebApp.Dockerfile
          push: true
          tags: mvcwebapplication20240528.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CA426B4397AE48E38D081ECA21509C3C }}/sample-app-aoai-chatgpt:${{ github.sha }}

  deploy:
    runs-on: ubuntu
